    gold_claims: []
    coverage_gap: "The corpus has NO Pauline epistle text (tlg0031 absent). Romans is present only indirectly via Origen's Commentary on Romans (tlg2042.tlg012, e.g. Comm. Rom. VII.16) and via patristic quotations (Irenaeus AH III.20.3 cites Rom 7). Romans 9 itself (predestination locus) cannot be cited from the primary text. The KG node work_pauline_epistle_romans referenced in queries.yaml is also absent from nodes.jsonl; the related modern-scholarship nodes argument_dihle_1982_paul_romans_7_split_will and argument_eastman_2017_romans7_* exist but concern Romans 7, not Romans 9. INGEST NEEDED: NA28 Romans 9 (or at least 9:14-24)."

