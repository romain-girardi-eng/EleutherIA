# =============================================================================
# EleutherIA — Local Development (self-contained)
# =============================================================================
# All services run locally: PostgreSQL + Backend + Frontend.
# No external dependencies required.
#
# Usage:
#   docker compose up -d --build              # Core services
#   docker compose --profile admin up -d      # + PgAdmin
#   docker compose --profile monitoring up -d # + Prometheus/Grafana
#   docker compose --profile full up -d       # Everything
#
# For production (Supabase), see deploy/production/
# =============================================================================

name: eleutheria

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eleutheria-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eleutheria}
      POSTGRES_USER: ${POSTGRES_USER:-eleutheria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eleutheria} # pragma: allowlist secret
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-eleutheria} -d ${POSTGRES_DB:-eleutheria}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Backend — FastAPI Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: eleutheria/backend:${TAG:-latest}
    container_name: eleutheria-backend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=100M
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-eleutheria}
      POSTGRES_USER: ${POSTGRES_USER:-eleutheria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eleutheria} # pragma: allowlist secret
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-5}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DATABASE_REQUIRED: ${DATABASE_REQUIRED:-false}
      ELEUTHERIA_KG_SNAPSHOT_DIR: ${ELEUTHERIA_KG_SNAPSHOT_DIR:-/app/data/kg}
      LLM_PREFERRED_PROVIDER: ${LLM_PREFERRED_PROVIDER:-codex}
      CODEX_PROXY_API_KEY: ${CODEX_PROXY_API_KEY:-}
      CODEX_PROXY_BASE_URL: ${CODEX_PROXY_BASE_URL:-http://cli-proxy-api:8317/v1}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      CODEX_LIGHT_MODEL: ${CODEX_LIGHT_MODEL:-gpt-5.6-terra}
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-high}
      CLAUDE_PROXY_API_KEY: ${CLAUDE_PROXY_API_KEY:-}
      CLAUDE_PROXY_BASE_URL: ${CLAUDE_PROXY_BASE_URL:-http://pragma-claude-proxy:8318/v1}
      CLAUDE_PROXY_MODEL: ${CLAUDE_PROXY_MODEL:-claude-opus-5}
      CLAUDE_PROXY_LIGHT_MODEL: ${CLAUDE_PROXY_LIGHT_MODEL:-claude-sonnet-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro-preview}
      GEMINI_LIGHT_MODEL: ${GEMINI_LIGHT_MODEL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY} # pragma: allowlist secret
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      PROMETHEUS_ENABLED: "true"
      PYTHONUNBUFFERED: "1"
      SPARQL_ENDPOINT: ${SPARQL_ENDPOINT:-http://fuseki:3030/eleutheria/sparql}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - internal
      - frontend
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Frontend — React + Nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: eleutheria/frontend:${TAG:-latest}
    container_name: eleutheria-frontend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:mode=1777,size=50M
      - /var/run:mode=1777,size=10M
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  # ---------------------------------------------------------------------------
  # PgAdmin (profile: admin)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: eleutheria-pgadmin
    restart: unless-stopped
    profiles:
      - admin
      - full
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@eleutherai.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD} # pragma: allowlist secret
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Prometheus (profile: monitoring)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eleutheria-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
      - full
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - internal
      - monitoring

  # ---------------------------------------------------------------------------
  # Grafana (profile: monitoring)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: eleutheria-grafana
    restart: unless-stopped
    profiles:
      - monitoring
      - full
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD} # pragma: allowlist secret
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ---------------------------------------------------------------------------
  # Fuseki SPARQL Endpoint (profile: sparql)
  # ---------------------------------------------------------------------------
  # Generate the Turtle dump first:
  #   python -m cli.main export kg --format rdf --output data/rdf/eleutheria
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: eleutheria-fuseki
    restart: unless-stopped
    profiles:
      - sparql
      - full
    command: ["/jena-fuseki/fuseki-server", "--file=/staging/eleutheria.ttl", "/eleutheria"]
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?set FUSEKI_ADMIN_PASSWORD} # pragma: allowlist secret
      JVM_ARGS: ${FUSEKI_JVM_ARGS:--Xmx2g}
    volumes:
      - ../data/rdf:/staging:ro
    ports:
      - "127.0.0.1:${FUSEKI_PORT:-3030}:3030"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  internal:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
  monitoring:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
