version: "3.9"

name: eleutheria-dev

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: eleutheria-postgres-dev
    environment:
      POSTGRES_USER: eleutheria
      POSTGRES_PASSWORD: eleutheria
      POSTGRES_DB: eleutheria
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eleutheria-qdrant-dev
    volumes:
      - qdrant_data_dev:/qdrant/storage
    ports:
      - "6333:6333"

  # Backend with hot reload
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend.dev
    container_name: eleutheria-backend-dev
    depends_on:
      - postgres
      - qdrant
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: eleutheria
      POSTGRES_USER: eleutheria
      POSTGRES_PASSWORD: eleutheria
      QDRANT_HOST: qdrant
      QDRANT_HTTP_PORT: 6333
      LLM_PREFERRED_PROVIDER: ${LLM_PREFERRED_PROVIDER:-kimi}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET_KEY: dev-secret-key
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: DEBUG
    volumes:
      # Mount source for hot reload
      - ../../database/src:/app/database/src:ro
      - ../../kg/src:/app/kg/src:ro
      - ../../graphrag/src:/app/graphrag/src:ro
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend with hot reload (run separately with npm run dev)
  # Or use this container:
  frontend:
    image: node:20-alpine
    container_name: eleutheria-frontend-dev
    working_dir: /app
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data_dev:
  qdrant_data_dev:
