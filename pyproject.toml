# EleutherIA - Root configuration
# Individual packages have their own pyproject.toml in database/, knowledge graph/, graphrag/

[build-system]
requires = ["setuptools>=78.1.1", "wheel"]  # <78.1.1: PYSEC-2025-49 (CVSS 8.8)
build-backend = "setuptools.build_meta"

[project]
name = "eleutheria"
version = "5.2.0"
description = "Ancient Philosophy Knowledge Graph - CLI Tools"
readme = "README.md"
license = {text = "CC-BY-4.0"}
authors = [{name = "Romain Girardi", email = "romain.girardi@univ-cotedazur.fr"}]
requires-python = ">=3.14"
keywords = ["ancient-philosophy", "knowledge-graph", "graphrag", "stoicism", "free-will"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.10.0",
    # Temporal workflows (workflow dispatch client; worker uses eleutheria_worker/pyproject.toml)
    "temporalio>=1.7.0",
]

[project.optional-dependencies]
api = [
    "httpx>=0.28.0",
]
dev = [
    "pytest>=9.0.3",  # <9.0.3: GHSA-6w46-j5rx-g56g
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "mypy>=1.14.0",
    "pyyaml>=6.0.3",  # <6.0.3: bundled libyaml CVE patches
]

[project.scripts]
eleutheria = "cli.main:main"

[project.urls]
Homepage = "https://free-will.app"
Repository = "https://github.com/romain-girardi-eng/EleutherIA"
Documentation = "https://github.com/romain-girardi-eng/EleutherIA/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "backend*", "eleutheria_worker*"]

[tool.pytest.ini_options]
testpaths = ["database/tests", "knowledge graph/tests", "graphrag/tests", "tests/eval"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "frontend/dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "node_modules", "frontend"]
plugins = ["pydantic.mypy"]
