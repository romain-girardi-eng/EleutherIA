[build-system]
requires = ["setuptools>=78.1.1", "wheel"]  # <78.1.1: PYSEC-2025-49 (CVSS 8.8)
build-backend = "setuptools.build_meta"

[project]
name = "eleutheria-mcp-server"
version = "0.1.0"
description = "MCP server exposing EleutherIA's GraphRAG tools to external agents"
authors = [{name = "Romain Girardi"}]
requires-python = ">=3.14"
license = {text = "CC-BY-4.0"}
readme = "README.md"
dependencies = [
    "mcp>=1.23.0",  # <1.23: GHSA-3qhf-m339-9g5v / -9h52-p55h-vw2f / -j975-95f5-7wqh
    "pydantic>=2.10.0",
    "starlette>=0.49.1",  # <0.49.1: GHSA-7f5h-v6xp-fcq8 (CVSS 7.5) + -2c2j-9gv5-cj73
    "uvicorn[standard]>=0.40.0",
    "eleutheria-database",
    "eleutheria-kg",
    "eleutheria-graphrag",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # <9.0.3: GHSA-6w46-j5rx-g56g
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.0",
    "mypy>=1.14.0",
    "httpx>=0.28.0",
]

[project.scripts]
eleutheria-mcp-stdio = "mcp_server.transports.stdio:main"
eleutheria-mcp-http = "mcp_server.transports.http:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["mcp_server*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
