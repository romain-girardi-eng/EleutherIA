# =============================================================================
# EleutherIA Frontend - Nginx Configuration
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The production bundle is built with VITE_API_URL pointing at the
    # publicly-routed backend (free-will.app by default,
    # overridable via the ELEUTHERIA_FE_API_URL compose arg). All XHR
    # traffic is therefore cross-origin and goes straight to the backend;
    # nginx here is a pure static server, no upstream proxy.

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 50M;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|json|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            default_type text/plain;
        }

        # Known dynamic React routes still need the SPA entrypoint. Static
        # top-level routes are prerendered to /route/index.html during build,
        # so unknown top-level URLs can return a real 404 instead of a soft 404.
        location ~ ^/(texts|simple|visualizer|graph|recherches|contributions|passages-canoniques|profile|share)/.+$ {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location ~ /\. {
            deny all;
        }

        error_page 404 /404.html;
    }
}
