[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eleutheria-kg"
version = "2.0.0"
description = "Knowledge graph framework for EleutherIA ancient philosophy database"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.14"
authors = [
    { name = "Romain Girardi", email = "romain.girardi@univ-cotedazur.fr" }
]
keywords = [
    "knowledge-graph",
    "ancient-philosophy",
    "free-will",
    "graph-analytics",
    "semantic-search",
    "digital-humanities"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = [
    "eleutheria-database>=2.0.0",
    "networkx>=3.4",
    "numpy>=2.1.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "mypy>=1.14.0",
    # services/snapshot.py does an optional `import httpx` for snapshot
    # uploads. The unit tests patch `httpx.put`, which requires httpx to
    # actually be importable, otherwise tests/unit/test_snapshot.py fails
    # with ModuleNotFoundError in CI.
    "httpx>=0.27",
    # Root-level scripts/ingest_chrysippus_svf_first1kgreek.py and
    # scripts/ingest_cleanthes_fragments.py import `lxml.etree` to parse
    # TEI XML from First1KGreek. tests/unit/test_chrysippus_svf_extractor.py
    # and tests/unit/test_cleanthes_extractor.py import those scripts at
    # collection time, so lxml must be importable in CI.
    "lxml>=5.0.0",
]
api = [
    "fastapi>=0.130.0",
    "uvicorn[standard]>=0.40.0",
]
community = [
    # Optional community detection algorithms
    "python-igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "python-louvain>=0.16",
]
semantic = [
    # RDF / OWL / SHACL stack for the neurosymbolic layer
    "rdflib>=7.6.0",
    "owlrl>=7.1.0",
    "pyshacl>=0.31.0",
]
full = [
    "eleutheria-kg[dev,api,community,semantic]",
]

[project.urls]
Homepage = "https://github.com/romain-girardi-eng/EleutherIA"
Documentation = "https://github.com/romain-girardi-eng/EleutherIA/tree/main/docs"
Repository = "https://github.com/romain-girardi-eng/EleutherIA"
Issues = "https://github.com/romain-girardi-eng/EleutherIA/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/eleutheria_kg"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["eleutheria_kg", "eleutheria_database"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
