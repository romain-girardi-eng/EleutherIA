[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eleutheria-graphrag"
version = "2.0.0"
description = "Graph-based RAG for scholarly Q&A on ancient philosophy"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.14"
authors = [
    { name = "Romain Girardi", email = "romain.girardi@univ-cotedazur.fr" }
]
keywords = [
    "graphrag",
    "RAG",
    "retrieval-augmented-generation",
    "knowledge-graph",
    "ancient-philosophy",
    "LLM",
    "scholarly-search"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "eleutheria-database>=2.0.0",
    "eleutheria-kg>=2.0.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "pydantic-ai[graph]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "mypy>=1.14.0",
    # tests/unit/test_infer_transitive.py imports the semantic layer (rdflib).
    # tests/unit/test_thesis_routes.py imports fastapi to exercise route shape.
    # Pin both here so `pip install -e graphrag/[dev]` is self-sufficient for CI.
    "rdflib>=7.1.1",
    "fastapi>=0.130.0",
]
api = [
    "fastapi>=0.130.0",
    "uvicorn[standard]>=0.40.0",
    "sse-starlette>=3.0.0",
    "pypandoc>=1.13",
]
llm = [
    # LLM providers
    "google-generativeai>=0.8.0",
    "openai>=2.0.0",
]
reranker = [
    # Local cross-encoder reranking (requires PyTorch — large dependency)
    "sentence-transformers>=3.0.0",
]
full = [
    "eleutheria-graphrag[dev,api,llm,reranker]",
]

[project.urls]
Homepage = "https://github.com/romain-girardi-eng/EleutherIA"
Documentation = "https://github.com/romain-girardi-eng/EleutherIA/tree/main/docs"
Repository = "https://github.com/romain-girardi-eng/EleutherIA"
Issues = "https://github.com/romain-girardi-eng/EleutherIA/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/eleutheria_graphrag"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# graphrag_service.py keeps unused params for API backwards-compatibility
"src/eleutheria_graphrag/services/graphrag_service.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["eleutheria_graphrag", "eleutheria_database", "eleutheria_kg"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require live infrastructure (DATABASE_URL, LLM key)",
]
