name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: pip install ruff==0.15.12

      - name: Run Ruff linter
        run: ruff check database/src "knowledge graph/src" graphrag/src

      - name: Run Ruff formatter check
        run: ruff format --check database/src "knowledge graph/src" graphrag/src

  test-database:
    name: Test Database Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: pip install -e "database/[dev]"

      - name: Run tests
        run: cd database && python -m pytest tests/ -v

  test-kg:
    name: Test KG Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          pip install -e database/
          pip install -e "knowledge graph/[dev]"

      - name: Run tests
        run: cd "knowledge graph" && python -m pytest tests/ -v

  test-graphrag:
    name: Test GraphRAG Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          pip install -e database/
          pip install -e "knowledge graph/"
          pip install -e "graphrag/[dev]"

      - name: Run tests
        run: cd graphrag && python -m pytest tests/ -v

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Typecheck (tsc -b)
        run: cd frontend && npx tsc -b

      - name: Run linter
        run: cd frontend && npm run lint

      - name: Run tests
        run: cd frontend && npm test -- --run

      - name: Build
        run: cd frontend && npx vite build
