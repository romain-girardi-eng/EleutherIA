name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: pip install ruff==0.15.12

      - name: Run Ruff linter
        run: ruff check database/src "knowledge graph/src" graphrag/src

      - name: Run Ruff formatter check
        run: ruff format --check database/src "knowledge graph/src" graphrag/src

  test-database:
    name: Test Database Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: pip install -e "database/[dev,api,full]"

      - name: Run tests
        run: cd database && python -m pytest tests/ -v

  test-kg:
    name: Test KG Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          pip install -e database/
          pip install -e "knowledge graph/[dev,semantic]"

      - name: Run tests
        run: cd "knowledge graph" && python -m pytest tests/ -v

  kg-invariants:
    name: KG RDF/SHACL Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install semantic tooling
        run: |
          pip install -e database/
          pip install -e "knowledge graph/[semantic]"

      - name: Regenerate SHACL shapes
        run: python "knowledge graph/src/eleutheria_kg/semantic/shapes/generate_shapes.py"

      - name: Ensure generated shapes are committed
        run: git diff --exit-code -- "knowledge graph/src/eleutheria_kg/semantic/shapes"

      - name: Validate KG invariants and write quality report
        run: python scripts/validate_kg_shacl.py --max-examples 100

      - name: Corpus invariants gate (strict)
        run: python -m scripts.check_corpus_invariants --strict

      - name: KG/corpus locus parity (cold-audit cohorts)
        run: |
          python scripts/check_kg_corpus_locus_parity.py --strict \
            --node-prefix passage_plotinus_vi_9_ \
            --node-prefix passage_meth_dla_ \
            --node-prefix passage_galen_plac_

      - name: Generated statistics drift gate
        run: python scripts/gen_stats.py --check

      - name: Citation fabrication gate (ISBN + verified manifest)
        run: python3 scripts/check_citations_gate.py --all

      - name: Upload SHACL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kg-shacl-reports
          path: |
            kg-invariants-shacl.md
            kg-quality-shacl.md

  kg-work-id-integrity:
    name: KG work-id Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pytest
        run: pip install pytest pytest-asyncio

      - name: Unit tests (collision detection)
        run: python -m pytest tests/test_check_kg_work_id_uniqueness.py -q

      # Warns (exit 0) on the known one-kg_work_id<->many-works collisions
      # committed in data/audit/kg_work_id_known_collisions.json; hard-fails
      # only when a NEW collision appears (new work node, or a new member work
      # joining a known group). Shrink the allowlist as works are remediated —
      # see data/audit/kg_work_id_collisions_report.md for the worklist.
      - name: kg_work_id uniqueness gate (offline, allowlisted)
        run: python scripts/check_kg_work_id_uniqueness.py

  test-graphrag:
    name: Test GraphRAG Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          pip install -e database/
          pip install -e "knowledge graph/"
          pip install -e "graphrag/[dev]"

      - name: Run tests
        run: cd graphrag && python -m pytest tests/ -v

  eval-offline:
    name: Offline Eval Gate
    runs-on: ubuntu-latest
    # Runs after the SHACL gate: the eval suites scan the same KG export the
    # invariants job has just validated.
    needs: kg-invariants
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packages
        run: |
          pip install -e database/
          pip install -e "knowledge graph/"
          pip install -e "graphrag/[dev]"
          pip install pyyaml httpx

      - name: Check gold fixtures are in sync with the audit corpus
        run: python scripts/eval/build_gold_from_audit.py --check

      - name: Run offline eval suites
        run: python -m pytest tests/eval -q

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Typecheck (tsc -b)
        run: cd frontend && npx tsc -b

      - name: Run linter
        run: cd frontend && npm run lint

      - name: Run tests
        run: cd frontend && npm test -- --run

      - name: Build
        run: cd frontend && npx vite build
