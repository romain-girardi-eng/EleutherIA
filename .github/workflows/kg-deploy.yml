name: KG Deploy (git → Supabase)

# Runs scripts/deploy_kg_to_supabase.py whenever data/kg/{nodes,edges}.jsonl
# changes on main. Manual override via workflow_dispatch.
#
# REQUIRED SECRETS:
#   SUPABASE_DATABASE_URL  — direct or session-pooler Supabase URL
#                            (port 5432; format `postgresql://postgres:PASSWORD@db.<project-ref>.supabase.co:5432/postgres?sslmode=require`)
#
# OPTIONAL SECRETS:
#   STAGING_SUPABASE_DATABASE_URL  — same shape, points at a staging Supabase
#                                    project. Used when the workflow is dispatched
#                                    with the `target=staging` input.
#
# The pooler URL on port 6543 (transaction mode) is NOT reliable for large
# transactional batch upserts via asyncpg. Use the direct/session-mode URL.
#
# Behavior:
#   1. SHACL invariants gate — refuses to deploy if data/kg/*.jsonl has any
#      ontology violations.
#   2. Dry-run to compute the delta.
#   3. Sanity gate — refuses if git is substantially smaller than prod.
#   4. Backup current prod state to a 90-day artifact (recovery insurance).
#   5. Single-transaction apply (rollback-safe).
#   6. Post-deploy parity check (asserts 0 git-only items remain after apply).
#
# To trigger manually:
#   gh workflow run kg-deploy.yml                              # full prod apply
#   gh workflow run kg-deploy.yml -f dry_run=true              # dry-run only
#   gh workflow run kg-deploy.yml -f max_nodes=100             # scoped apply
#   gh workflow run kg-deploy.yml -f target=staging            # against staging

on:
  push:
    branches: [main]
    paths:
      - 'data/kg/nodes.jsonl'
      - 'data/kg/edges.jsonl'
      - 'scripts/deploy_kg_to_supabase.py'
      - '.github/workflows/kg-deploy.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run only (no DB writes)'
        type: boolean
        default: false
      target:
        description: 'Deploy target'
        type: choice
        default: 'production'
        options:
          - 'production'
          - 'staging'
      max_nodes:
        description: 'Limit node upserts (empty = unlimited)'
        required: false
        default: ''
      max_edges:
        description: 'Limit edge inserts (empty = unlimited)'
        required: false
        default: ''
      mode:
        description: 'Apply mode: only-new (fast, default) | smart-diff (catches metadata edits) | full (every node, slowest)'
        type: choice
        default: 'only-new'
        options:
          - 'only-new'
          - 'smart-diff'
          - 'full'

permissions:
  contents: read

concurrency:
  group: kg-deploy-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event.inputs.target || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies (asyncpg + KG semantic for SHACL)
        run: |
          pip install asyncpg
          pip install -e database/
          pip install -e "knowledge graph/[semantic]"

      - name: Choose target DSN
        id: target
        env:
          PROD_DSN: ${{ secrets.SUPABASE_DATABASE_URL }}
          STAGING_DSN: ${{ secrets.STAGING_SUPABASE_DATABASE_URL }}
        run: |
          TARGET="${{ github.event.inputs.target || 'production' }}"
          if [ "$TARGET" = "staging" ]; then
            if [ -z "$STAGING_DSN" ]; then
              echo "::error::target=staging but STAGING_SUPABASE_DATABASE_URL secret not set."
              exit 1
            fi
            echo "target=staging" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DATABASE_URL=$STAGING_DSN" >> "$GITHUB_ENV"
            DSN="$STAGING_DSN"
          else
            if [ -z "$PROD_DSN" ]; then
              echo "::error::SUPABASE_DATABASE_URL secret not set. Add it under Settings → Secrets and variables → Actions → New repository secret."
              echo "::error::Format: postgresql://postgres:PASSWORD@db.<project-ref>.supabase.co:5432/postgres?sslmode=require"
              exit 1
            fi
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DATABASE_URL=$PROD_DSN" >> "$GITHUB_ENV"
            DSN="$PROD_DSN"
          fi
          MASKED=$(echo "$DSN" | sed -E 's|(://[^:]+:)[^@]+(@)|\1<REDACTED>\2|')
          echo "Deploying to $TARGET: $MASKED"
          echo "::notice::Target = $TARGET"

      - name: SHACL invariants gate (refuse broken data)
        run: |
          echo "Running SHACL invariants on data/kg/*.jsonl …"
          python scripts/validate_kg_shacl.py --skip-quality --max-examples 50
          # validate_kg_shacl.py exits non-zero on violation, so a non-zero exit
          # status here means the gate caught broken data and aborts the deploy.

      - name: Dry-run (compute delta vs prod)
        run: python scripts/deploy_kg_to_supabase.py --dump-delta /tmp/deploy_delta.json

      - name: Sanity gate (refuse if deploy would silently lose content)
        run: |
          python - <<'PY'
          import json
          d = json.load(open('/tmp/deploy_delta.json'))['summary']
          # The previous gate compared total counts (git vs prod) but kept tripping
          # on the legitimate ~38-node prod-only gap (rename orphans from past
          # cleanups that we intentionally leave in place). Switch to a check on
          # the IN-FLIGHT delta itself:
          #   - prod-only items > 500 means prod has drifted far from git
          #     (probably an unrelated batch landed since the last deploy → abort
          #      and re-snapshot first to avoid clobbering metadata)
          #   - git-side delta is huge with zero new content (somehow git lost
          #     everything but kept the same node count) — extremely unlikely,
          #     but worth flagging
          msg_ok = f"::notice::Sanity OK. Delta: +{d['nodes_only_in_git']} nodes / +{d['edges_to_insert']} edges. Prod-only orphans: {d['nodes_only_in_prod']} nodes / {d['edges_only_in_prod']} edges (preserved)."
          if d['nodes_only_in_prod'] > 500 or d['edges_only_in_prod'] > 5000:
              print(f"::error::Prod has {d['nodes_only_in_prod']} nodes / {d['edges_only_in_prod']} edges NOT in git.")
              print("::error::This suggests prod drifted significantly since the last deploy.")
              print("::error::Run scripts/export_kg_snapshot.py first to sync git, review the diff, then re-deploy.")
              raise SystemExit(2)
          print(msg_ok)
          PY

      - name: Upload pre-deploy delta artifact (always — audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-delta-${{ github.run_id }}
          path: /tmp/deploy_delta.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Backup prod state (recovery artifact)
        # Run before apply, even on dry-run, so the artifact always exists for that run.
        # Reads via DB connection (not the public API) since Cloudflare 403s GH Actions IPs.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Backing up current prod KG state via DB (recovery artifact, 90-day retention) …"
          python - <<'PY'
          import asyncio, asyncpg, json, os, hashlib

          async def main():
              dsn = os.environ["SUPABASE_DATABASE_URL"]
              conn = await asyncpg.connect(dsn=dsn, statement_cache_size=0)
              try:
                  print("  fetching prod nodes via DB …")
                  rows = await conn.fetch(
                      "SELECT node_id, label, type, description, period, metadata "
                      "FROM free_will.kg_nodes")
                  nodes = []
                  for r in rows:
                      md = r["metadata"]
                      if isinstance(md, str):
                          try: md = json.loads(md)
                          except: md = {}
                      nodes.append({"id": r["node_id"], "label": r["label"], "type": r["type"],
                                    "description": r["description"], "period": r["period"],
                                    "metadata": md or {}})
                  print(f"  prod nodes: {len(nodes):,}")
                  with open("/tmp/prod_backup_nodes.jsonl", "w", encoding="utf-8") as f:
                      for n in nodes:
                          f.write(json.dumps(n, ensure_ascii=False) + "\n")

                  print("  fetching prod edges via DB …")
                  rows = await conn.fetch(
                      "SELECT source_id, target_id, relation, weight, metadata "
                      "FROM free_will.kg_edges")
                  edges = []
                  for r in rows:
                      md = r["metadata"]
                      if isinstance(md, str):
                          try: md = json.loads(md)
                          except: md = {}
                      edges.append({"source": r["source_id"], "target": r["target_id"],
                                    "relation": r["relation"],
                                    "weight": float(r["weight"]) if r["weight"] else 1.0,
                                    "metadata": md or {}})
                  print(f"  prod edges: {len(edges):,}")
                  with open("/tmp/prod_backup_edges.jsonl", "w", encoding="utf-8") as f:
                      for e in edges:
                          f.write(json.dumps(e, ensure_ascii=False) + "\n")
              finally:
                  await conn.close()

              def sha(p):
                  h = hashlib.sha256()
                  with open(p, "rb") as fp:
                      for chunk in iter(lambda: fp.read(8192), b""): h.update(chunk)
                  return h.hexdigest()
              manifest = {
                  "kind": "prod-backup-pre-deploy",
                  "source": "supabase_db",
                  "node_count": len(nodes),
                  "edge_count": len(edges),
                  "files": {
                      "/tmp/prod_backup_nodes.jsonl": {"sha256": sha("/tmp/prod_backup_nodes.jsonl")},
                      "/tmp/prod_backup_edges.jsonl": {"sha256": sha("/tmp/prod_backup_edges.jsonl")},
                  },
              }
              with open("/tmp/prod_backup_manifest.json", "w") as f:
                  json.dump(manifest, f, indent=2, ensure_ascii=False)
              print(f"\n  Backup manifest:")
              print(json.dumps(manifest, indent=2))

          asyncio.run(main())
          PY

      - name: Upload prod backup (90-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-backup-pre-${{ github.run_id }}
          path: |
            /tmp/prod_backup_nodes.jsonl
            /tmp/prod_backup_edges.jsonl
            /tmp/prod_backup_manifest.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Apply (upsert in single transaction)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
        run: |
          # Default mode = `only-new`: fastest, pushes net-new nodes/edges.
          # Smart-diff is the most correct (catches metadata edits on existing
          # nodes) but each smart-diff upsert is a per-row asyncpg round-trip
          # through the Supabase session pooler — over the GH Actions → eu-west-1
          # link that occasionally trips Supabase's statement_timeout (~3min).
          # Periodic `smart-diff` and full re-syncs are available via
          # workflow_dispatch `mode=`.
          MODE="${{ github.event.inputs.mode || 'only-new' }}"
          case "$MODE" in
            only-new)   ARGS="--apply --only-new" ;;
            smart-diff) ARGS="--apply --smart-diff" ;;
            full)       ARGS="--apply" ;;
            *)          ARGS="--apply --only-new" ;;
          esac
          if [ -n "${{ github.event.inputs.max_nodes }}" ]; then
            ARGS="$ARGS --max-nodes ${{ github.event.inputs.max_nodes }}"
          fi
          if [ -n "${{ github.event.inputs.max_edges }}" ]; then
            ARGS="$ARGS --max-edges ${{ github.event.inputs.max_edges }}"
          fi
          echo "Running: python scripts/deploy_kg_to_supabase.py $ARGS"
          python scripts/deploy_kg_to_supabase.py $ARGS

      - name: Post-deploy parity check
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
        run: |
          echo "Re-running dry-run to verify post-apply parity …"
          python scripts/deploy_kg_to_supabase.py --dump-delta /tmp/post_deploy_delta.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/post_deploy_delta.json'))['summary']
          if d['nodes_only_in_git'] > 0 or d['edges_to_insert'] > 0:
              print(f"::warning::Post-deploy still shows {d['nodes_only_in_git']} nodes / {d['edges_to_insert']} edges not in prod.")
              print("::warning::Some upserts may have been skipped (foreign-key issues, row failures, etc.). Check logs.")
              # Exit non-zero so the workflow surfaces partial-deploy failures as a red X
              if d['nodes_only_in_git'] > 5 or d['edges_to_insert'] > 25:
                  raise SystemExit(3)
          else:
              print(f"::notice::✓ git ↔ prod parity confirmed: {d['git_nodes']} nodes / {d['git_edges']} edges")
          PY

      - name: Upload post-deploy delta
        if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-delta-${{ github.run_id }}
          path: /tmp/post_deploy_delta.json
          retention-days: 90
          if-no-files-found: ignore
