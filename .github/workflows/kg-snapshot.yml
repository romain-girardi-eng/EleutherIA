name: KG Snapshot

# SAFETY NOTE (2026-05-16):
# Daily cron disabled — git was getting ahead of the live production DB, so the
# snapshot bot was at risk of overwriting unsynced edits. Re-enable the schedule
# trigger ONLY after either (a) the loader script (scripts/deploy_kg_to_supabase.py)
# is in regular use to push git → prod, or (b) the team accepts that git is
# strictly downstream of prod.
#
# Manual runs remain available via workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Backend base URL (defaults to production)'
        required: false
        default: ''
      allow_destructive:
        description: 'Allow snapshot to commit even when it would DELETE nodes/edges (use when prod is intentionally smaller than git)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: kg-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install semantic tooling
        run: |
          pip install -e database/
          pip install -e "knowledge graph/[semantic]"

      - name: Record pre-snapshot counts
        id: pre
        run: |
          NODES_BEFORE=$(wc -l < data/kg/nodes.jsonl | tr -d ' ')
          EDGES_BEFORE=$(wc -l < data/kg/edges.jsonl | tr -d ' ')
          echo "nodes=$NODES_BEFORE" >> "$GITHUB_OUTPUT"
          echo "edges=$EDGES_BEFORE" >> "$GITHUB_OUTPUT"
          echo "Before snapshot: $NODES_BEFORE nodes / $EDGES_BEFORE edges"

      - name: Export KG snapshot
        env:
          KG_API_BASE: ${{ github.event.inputs.base_url || 'https://free-will.app' }}
        run: |
          python scripts/export_kg_snapshot.py

      - name: Validate snapshot invariants
        run: python scripts/validate_kg_shacl.py --skip-quality --max-examples 50

      - name: Regenerate RDF export
        run: python cli/main.py export kg --format rdf --output data/rdf/eleutheria

      - name: Destructive-snapshot safety gate
        id: safety
        run: |
          NODES_AFTER=$(wc -l < data/kg/nodes.jsonl | tr -d ' ')
          EDGES_AFTER=$(wc -l < data/kg/edges.jsonl | tr -d ' ')
          NODES_BEFORE=${{ steps.pre.outputs.nodes }}
          EDGES_BEFORE=${{ steps.pre.outputs.edges }}
          NODES_DELTA=$((NODES_AFTER - NODES_BEFORE))
          EDGES_DELTA=$((EDGES_AFTER - EDGES_BEFORE))
          echo "After snapshot:  $NODES_AFTER nodes ($NODES_DELTA) / $EDGES_AFTER edges ($EDGES_DELTA)"
          ALLOW='${{ github.event.inputs.allow_destructive }}'
          if { [ "$NODES_DELTA" -lt -10 ] || [ "$EDGES_DELTA" -lt -50 ]; } && [ "$ALLOW" != "true" ]; then
            echo ""
            echo "::error::Snapshot would shrink the KG by $NODES_DELTA nodes / $EDGES_DELTA edges."
            echo "::error::This usually means git is ahead of the production DB (unsynced local edits)."
            echo "::error::To override, re-run with allow_destructive=true."
            exit 2
          fi

      - name: Show diff summary
        run: |
          git add data/kg/
          if git diff --cached --quiet; then
            echo "No changes."
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
            echo "---"
            git diff --cached --stat data/kg/
          fi

      - name: Commit and push
        if: env.HAS_CHANGES == 'true'
        run: |
          git config user.name "kg-snapshot-bot"
          git config user.email "kg-snapshot-bot@users.noreply.github.com"
          TS=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "chore(kg): snapshot ${TS}"
          git push
