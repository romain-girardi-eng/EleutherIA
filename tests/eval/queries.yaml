    predicated even of the gods and of the First, beyond all things.
  - Plotinus refuses to locate human self-determination (to eph' hemin) in mere impulse
    (horme) or appetite (orexis), which children, beasts, and the mad also have; it
    must rest on right reason and right desire.
  - Plotinus argues that the One's power is not the power for opposites; its making
    of itself is a single act identical with its will (boulesis), so that the One's
    will and its substance (ousia) are not distinct.
