  - baa51e4b-9ad7-54a1-a971-74de1631661e
  gold_claims:
  - Justin grounds free choice (proairesis eleuthera) in the denial of fate, arguing
    that without it praise and blame would be meaningless.
  - Origen devotes a dedicated treatment 'On free will' (Peri autexousiou) to the
    question, calling it one of the most necessary problems.
  - 'Origen derives autexousion from the doctrine of God''s just judgement: because
    praise- and blame-worthy things are ''up to us'' (to eph'' hēmin), free will follows.'
