- id: r001
  query: 'Justin''s autexousion in 1 Apol. 43 and 2 Apol. 7: continuity or discontinuity
    with Middle Platonism (Karamanolis vs Andresen)?'
  expected_entities:
  - person_justin_martyr_2c_ce
  - concept_autexousion_christian_freedom_u1v2w3x4
  expected_entity_keywords:
  - justin
  - autexousion
  - middle platonism
  - karamanolis
  - andresen
  expected_works:
  - work_justin_first_apology
  - work_justin_second_apology_sc507
  query_type: romain_thesis_queries
  difficulty: hard
  expected_passages:
  - 688bbd38-3ae3-5c2a-bffc-6d11dd2f039b
  - cfc0d099-45c2-5c7e-b23a-d4e508707f0b
  - 0b68baff-e316-4734-a491-acb5acdafee3
  gold_claims:
  - Justin argues that if all things happen by fate (kath' heimarmenen), nothing is
    up to us (to eph' hemin) and there is no ground for praise or blame.
  - Justin affirms that the human race has the power of free choice (proairesis eleuthera)
    to flee what is shameful and choose what is noble.
  - 'Justin distinguishes divine foreknowledge (prognosis) from fated necessity (heimarmene):
    prophesied events are foreknown, not predetermined by fate.'
  - Justin states that God made the race of angels and of men autexousion (self-determining)
    from the beginning, which is why they justly bear punishment for their faults.
  - Justin rejects the Stoic doctrine that all things come to be by the necessity
    of fate (kath' heimarmenes ananken), holding instead that each succeeds or fails
    according to his own choice (proairesis).
- id: r002
  query: Compare Origen's responsibility argument in De Principiis III.1.5–6 with
    the anti-astrological argument from Commentary on Genesis III preserved in Philocalia
    23.1. Use the available translations, distinguish the two works and their transmission,
    and do not present these French corpus translations as Latin or Greek witnesses.
  expected_entities:
  - person_origen_alexandria_185_254ce_s9t0u1v2
  - argument_origen_anti_astrological
  - argument_origens_de_principiis_argument_for_free_will_93d043fc
  expected_entity_keywords:
  - origen
  - astrology
  - de principiis
  - rufinus
  - catenae
  expected_works:
  - work_de_principiis_origen_230s_v2w3x4y5
  - work_origen_commentary_genesis
  - work_origen_philocalia
  query_type: romain_thesis_queries
  difficulty: hard
  expected_passages:
  - ae853539-5bf0-592e-9323-f4dad81d7fc8
  - 5d4a53e1-3e27-5179-98b4-1aa1231218f3
  - 481e3e44-0c73-54f3-9190-73f09e332def
  gold_claims:
  - Origen argues it is absurd to shift the cause of our actions onto external events,
    since we are entirely the cause of them ourselves; to deny this is to make us
    like wood and stones moved only from outside.
  - Origen confirms by Scripture (Micah, Moses, Isaiah) that living well or badly
    is our own work, not forced by external events or by fate.
  - In the Commentary on Genesis excerpt preserved in Philocalia 23, Origen argues
    that astral determinism would abolish divine judgment, rewards and punishments,
    and render faith and Christ's coming pointless.
  - Origen argues that astrological fatalism excuses human wrongdoers while imputing
    responsibility for their actions to God, and credits the stars rather than God
    with Christ's powers.
