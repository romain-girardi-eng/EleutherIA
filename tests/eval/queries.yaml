- id: q028
  query: What survives of Chrysippus' On Fate in Gellius and Cicero?
  expected_entities:
  - person_chrysippus_280_206bce_i9j0k1l2
  - person_cicero_marcus_tullius_106_43bce_a8f3d2c1
  expected_entity_keywords:
  - chrysippus
  - cylinder
  - cone
  - gellius
  - cicero
  query_type: fragment
  difficulty: hard
  expected_passages:
  - 2d2eee67-6073-563d-95ce-66ffa11ce8be
  - fa311a9a-11fc-4c84-837c-a8b1369f8477
  - 1812b556-ba17-4407-9998-f0383d158dd2
  - fc50aff8-32e5-443b-950d-35ad89b15d96
  gold_claims:
  - Gellius reports Chrysippus's definition of fate (heimarmenē) as a sempiternal
    and unbending series and chain of things, coiling and unfolding itself through
    eternal sequences.
  - Gellius attributes the cylinder (lapis cylindrus) example to Chrysippus, who used
    a rolling stone to illustrate how fate gives the impulse while the thing moves
    by its own nature.
  - 'Cicero preserves Chrysippus''s cylinder analogy: the impression imparts the starting
    impulse to assent as one who shoves a cylinder gives it the start of motion, yet
    assent then moves by its own force.'
  - Cicero preserves Chrysippus's distinction between perfect/principal and auxiliary/proximate
    causes as his strategy to retain fate without necessity.
  expected_works:
  - work_gellius_na_vii_2
  - work_de_fato_cicero_44bce_b9c4e5d2
