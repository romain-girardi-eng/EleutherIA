  expected_passages:
  - 01aa3782-db59-442d-8887-b74f4f32df38
  - 8ba2536b-c925-490f-b37b-f48bde28a03f
  gold_claims:
  - The Lazy Argument concludes that, since the outcome is fated either way, taking
    action (e.g. calling a doctor) makes no difference.
  - Cicero reports that this type of argument was named the 'lazy and inert' argument
    (ignavum atque iners) because by the same reasoning all action would be removed
    from life.
  - 'Chrysippus replies by distinguishing simple from co-fated (confatalia) events:
    that Laius will beget Oedipus is fated together with his lying with his wife,
    so the two are co-fated rather than independent.'
