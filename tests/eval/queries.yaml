# EleutherIA GraphRAG evaluation set.
#
# Curated questions with expected KG node IDs. Used by run_eval.py to capture
# baseline retrieval quality before and after pipeline changes.
#
# Fields:
#   id                          stable identifier (qNNN)
#   query                       natural-language question sent to the API
#   expected_entities           KG node IDs we expect the pipeline to surface
#                               (citations / sources / context_nodes / seed_nodes)
#   expected_entity_keywords    fallback substring match on returned node labels
#                               + the answer text, for cases where the exact
#                               node id is unstable or several variants are
#                               acceptable
#   expected_works              KG work-node IDs we expect to be cited
#   query_type                  concept-author | school-debate | fact |
#                               comparison | fragment
#   difficulty                  easy | medium | hard
#
# All IDs were sampled from data/kg/nodes.jsonl. If an id ever changes, the
# keyword fallback keeps the query usable.

