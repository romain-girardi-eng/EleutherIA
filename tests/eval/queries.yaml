- id: q023
  query: Compare Plotinus and Augustine on the freedom of the will
  expected_entities:
  - person_plotinus_d270
  - person_augustine_hippo_d430
  - concept_liberum_arbitrium_u3v4w5x6
  expected_entity_keywords:
  - plotinus
  - augustine
  - free will
  - liberum arbitrium
  query_type: comparison
  difficulty: hard
  expected_passages:
  - 6069392c-49b6-4823-a710-c0043e6e52a2
  - d268796c-f6fd-4a6f-9508-55b84cf14765
  - a580914c-841a-560c-9923-5ec6f34f80c0
  - 195ed922-a62f-5410-a3fc-1f9003a9561a
  gold_claims:
  - Plotinus holds that the soul becomes free through Intellect (nous), striving unimpeded
    toward the Good.
  - For Plotinus, 'what is up to us' is properly assigned to right reason and right
    desire (orthos logismos / orthē orexis), not to appetite or passion, which are
    shared with children and beasts.
  - Augustine argues that divine foreknowledge of our will does not nullify the will,
    because what God foreknows is precisely that there is something in our will.
  - For Augustine the will (voluntas) is constitutive of all the affections — desire,
    joy, fear, sadness are all forms of will — so the moral quality of a life depends
    on the quality of the will.
- id: q024
  query: How does Alexander of Aphrodisias differ from Chrysippus on causation?
  expected_entities:
  - person_alexander_aphrodisias_fl200ce_n5o6p7q8
  - person_chrysippus_280_206bce_i9j0k1l2
  - debate_alexander_stoics_determinism
  expected_entity_keywords:
  - alexander
  - chrysippus
  - causation
  - determinism
  query_type: comparison
  difficulty: hard
  expected_passages:
  - fc50aff8-32e5-443b-950d-35ad89b15d96
  - 1812b556-ba17-4407-9998-f0383d158dd2
  - 6d9d85c8-ffa3-48f5-b5fe-9ef25cd19aa0
  gold_claims:
  - Chrysippus distinguishes perfect and principal causes (perfectae et principales)
    from auxiliary and proximate ones (adiuvantes et proximae) in order to escape
    necessity while retaining fate.
  - Chrysippus's cylinder analogy holds that the external impression (visum) gives
    the assent its starting impulse, as a push starts a cylinder rolling, but the
    assent then moves by its own force and nature (suapte vi et natura).
  - Alexander, against this, makes the human being himself a principle (archē) and
    cause (aitia) of his actions, not merely a proximate cause whose own nature is
    externally determined.
