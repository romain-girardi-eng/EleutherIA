# EleutherIA — app manifest
#
# ─────────────────────────────────────────────────────────────────────────
# IMPORTANT — PUBLIC GITHUB REPOSITORY
# EleutherIA is a published scholarly dataset.
# Its home is and must remain the PUBLIC GitHub repository
#   https://github.com/romain-girardi-eng/EleutherIA   (branch: main)
# because the Zenodo DOIs, the CC BY 4.0 license, academic citations and
# the GEO/llms.txt surface all point there.
# ─────────────────────────────────────────────────────────────────────────
#
# Conforms to a minimal app manifest (slug, display_name, primary_hostname,
# preview_hostname, port required). Extra keys below the marker are
# EleutherIA-specific.

slug: eleutheria
display_name: EleutherIA
blueprint_version: none

created_at: "2026-06-12T00:00:00Z"
created_by: romain

# Linkage (set via POST /v1/apps/{slug}/link)
app_id: null
client_id: null
partner_id: null

# Hosting
primary_hostname: free-will.app
preview_hostname: preview.free-will.app   # reserved; primary serving is free-will.app
dev_hostname: dev.free-will.app           # reserved; local dev is vite+uvicorn
port: 8015                                # host port of eleutheria-api on prod

# Lifecycle state (mutated by `make deploy` / `make rollback`)
last_deploy_sha: null
last_deploy_at: null
last_deploy_actor: null
deploy_history: []
production_tunnel_id: null
dev_tunnel_id: null

# ── EleutherIA-specific ───────────────────────────────────────────────────
api_hostname: free-will.app
home_server: <deploy-host>
project_dir: /home/deploy/EleutherIA
databases:
  - container: eleutheria-db
    db: eleutheria
